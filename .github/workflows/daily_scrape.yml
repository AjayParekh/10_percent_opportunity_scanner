name: Daily Market Scanner
on:
  schedule:
    - cron: '30 2 * * 1-5'  # Runs at 8:00 AM IST, Monday to Friday
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 pandas yfinance

      - name: Run Worker
        run: python daily_worker.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add market_snapshot.db
          git commit -m "Automated daily market update" || echo "No changes to commit"
          git pull --rebase origin main
          git push
